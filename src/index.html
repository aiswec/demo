<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A project built with AISWEC</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 18px/1.5 system-ui, sans-serif; background: #fff; color: #1f2328; }
      @media (prefers-color-scheme: dark) { body { background: #0d1117; color: #e6edf3; } }
      main { padding: 24px; max-width: 36rem; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="greeting"></h1>
      <section>
        <label>Bill total <input id="bill" type="number" min="0" step="0.01" value="0" /></label>
        <label>
          Tip
          <select id="tip-percent">
            <option value="10">10%</option>
            <option value="15" selected>15%</option>
            <option value="20">20%</option>
          </select>
        </label>
        <p>Tip: <span id="tip-amount">$0.00</span></p>
        <p>Total: <span id="total-amount">$0.00</span></p>
      </section>
      <p>The first page of a project built with AISWEC. Ask for the next one in plain words.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
